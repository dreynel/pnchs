<style>
  /* ── DTR Content styles (scoped) ── */
  .dtr-report-wrap {
    padding: 20px 24px 32px;
    min-height: 100%;
  }

  /* View Mode Selector Tabs */
  .dtr-view-toggle-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 6px;
    border-radius: 12px;
    width: fit-content;
  }

  .dtr-view-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all .15s;
  }

  .dtr-view-tab:hover {
    color: var(--navy-mid);
    background: var(--navy-light);
  }

  .dtr-view-tab.active {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 2px 8px rgba(30,58,95,0.25);
  }

  /* ── CS Form No. 48 Official Paper Container ── */
  .cs48-paper-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .cs48-paper {
    background: #fff;
    color: #000;
    font-family: 'Times New Roman', Times, serif;
    width: 100%;
    max-width: 680px;
    padding: 24px 28px;
    border: 1.5px solid #222;
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    line-height: 1.25;
  }

  .cs48-top-tag {
    font-size: 10.5px;
    font-style: italic;
    margin-bottom: 4px;
  }

  .cs48-header {
    text-align: center;
    margin-bottom: 14px;
  }

  .cs48-header .h-rep { font-size: 12px; }
  .cs48-header .h-dept { font-size: 12px; font-weight: bold; }
  .cs48-header .h-reg { font-size: 11px; }
  .cs48-header .h-div { font-size: 12.5px; font-weight: bold; letter-spacing: 0.3px; margin-top: 2px; }
  .cs48-header .h-school { font-size: 13.5px; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
  .cs48-header .h-id { font-size: 11px; font-weight: bold; }
  .cs48-header .h-addr { font-size: 11px; }
  .cs48-header .h-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .cs48-emp-block {
    text-align: center;
    margin: 14px 0 10px;
  }

  .cs48-emp-name {
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    border-bottom: 1px solid #000;
    display: inline-block;
    padding: 0 24px 1px;
  }

  .cs48-emp-sub {
    font-size: 10.5px;
    font-style: italic;
    margin-top: 2px;
  }

  .cs48-period-bar {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    margin-bottom: 8px;
    padding: 0 2px;
  }

  /* CS 48 Grid Table */
  .cs48-table {
    width: 100%;
    border-collapse: collapse;
    border: 1.5px solid #000;
    font-size: 11px;
    text-align: center;
  }

  .cs48-table th, .cs48-table td {
    border: 1px solid #000;
    padding: 2.5px 2px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .cs48-table th {
    font-weight: bold;
    font-size: 9.5px;
    background: #f8f8f8;
    text-transform: uppercase;
  }

  .cs48-td-day { font-weight: bold; font-size: 11px; width: 34px; }
  .cs48-span-cell { font-style: italic; color: #333; background: #fafafa; font-size: 10.5px; letter-spacing: 0.5px; }
  .cs48-td-val { font-size: 11px; }

  /* Footer Totals */
  .cs48-footer-block {
    margin-top: 10px;
    font-size: 11px;
  }

  .cs48-summary-grid {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #000;
    padding-top: 6px;
    margin-bottom: 14px;
    font-size: 11px;
  }

  .cs48-cert-text {
    font-size: 10.5px;
    text-align: justify;
    line-height: 1.35;
    margin-bottom: 28px;
  }

  .cs48-sig-wrap {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 24px;
  }

  .cs48-sig-box {
    text-align: center;
    width: 220px;
  }

  .cs48-sig-line {
    border-bottom: 1px solid #000;
    margin-bottom: 3px;
  }

  .cs48-sig-name {
    font-weight: bold;
    font-size: 11.5px;
    text-transform: uppercase;
  }

  .cs48-sig-title {
    font-size: 10px;
  }

  .cs48-approval-block {
    margin-top: 16px;
  }

  /* ── Detailed Analytics View (Existing View) ── */
  .dtr-report-header {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .dtr-rh-left { display: flex; align-items: center; gap: 14px; }
  .dtr-rh-avatar {
    width: 48px; height: 48px; border-radius: 13px;
    background: var(--navy); border: 2px solid #3a6fad;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-size: 16px; color: #fff; flex-shrink: 0;
  }
  .dtr-rh-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--navy); }
  .dtr-rh-sub { font-size: 11.5px; color: var(--muted2); margin-top: 3px; }
  .dtr-rh-period {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    font-size: 11px; font-weight: 600; color: var(--navy-mid);
    background: var(--navy-light); border: 1px solid #c5d8f5; padding: 3px 10px; border-radius: 20px;
  }

  .dtr-summary-table {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-bottom: 16px;
  }
  .dtr-sum-head {
    display: grid; grid-template-columns: 180px 1fr 1fr 1fr;
    background: var(--navy); padding: 10px 20px; border-radius: 14px 14px 0 0;
  }
  .dtr-sum-head span {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; color: rgba(255, 255, 255, 0.65);
  }
  .dtr-sum-head span:not(:first-child) { text-align: center; }
  .dtr-sum-row {
    display: grid; grid-template-columns: 180px 1fr 1fr 1fr;
    padding: 12px 20px; border-bottom: 1px solid var(--border); align-items: center;
  }
  .dtr-sum-row:last-child { border-bottom: none; }
  .dtr-sum-row:nth-child(even) { background: var(--surface2); }
  .dtr-sum-row.total-row { background: var(--navy-light); border-top: 2px solid #c5d8f5; }
  .dtr-sum-row-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .dtr-sum-cell { text-align: center; }
  .dtr-sum-big { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--navy); display: block; }
  .dtr-sum-small { font-size: 10px; color: var(--muted2); margin-top: 2px; display: block; }
  .dtr-sum-late { color: var(--red) !important; }
  .dtr-sum-hours { color: var(--navy) !important; font-weight: 600; }

  .dtr-table-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-bottom: 24px;
  }
  .dtr-table-card-header {
    padding: 16px 20px; border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .dtr-table-card-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--navy); }
  .dtr-table-card-sub { font-size: 11px; color: var(--muted2); margin-top: 2px; }

  .dtr-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .dtr-leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dtr-leg-dot { width: 8px; height: 8px; border-radius: 2px; }

  .dtr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .dtr-table thead th {
    padding: 9px 14px; text-align: left; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em; color: var(--muted2);
    border-bottom: 1.5px solid var(--border); white-space: nowrap; background: var(--surface);
  }
  .dtr-table thead th.center { text-align: center; }
  .dtr-table tbody td { padding: 8px 14px; border-bottom: 1px solid rgba(226, 221, 214, 0.45); vertical-align: middle; }
  .dtr-table tbody tr:last-child td { border-bottom: none; }

  .dtr-table tbody tr.row-weekend td { background: var(--surface2); color: var(--muted2); }
  .dtr-table tbody tr.row-absent:not(.row-weekend) td { background: rgba(192, 57, 43, 0.03); }
  .dtr-table tbody tr.row-halfday td { background: rgba(146, 100, 10, 0.03); }
  .dtr-table tbody tr.row-present:hover td { background: var(--navy-hover); }

  .day-num-cell { display: flex; align-items: center; gap: 6px; }
  .day-num {
    width: 26px; height: 26px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; flex-shrink: 0;
  }
  .day-num.weekend { background: var(--surface2); color: var(--muted2); }
  .day-num.present { background: var(--green-dim); color: var(--green); }
  .day-num.half-day { background: rgba(146, 100, 10, 0.1); color: var(--accent); }
  .day-num.absent { background: var(--red-dim); color: var(--red); }

  .day-label { font-size: 11px; color: var(--muted2); }
  .time-cell { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text); }
  .time-cell.empty { color: var(--muted2); font-style: italic; font-size: 11px; }

  .time-pair { display: flex; flex-direction: column; gap: 1px; align-items: center; }
  .time-pair .t-in { font-size: 12px; color: var(--navy); font-weight: 500; }
  .time-pair .t-out { font-size: 11px; color: var(--muted); }

  .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; white-space: nowrap;
  }
  .status-badge.present { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-brd); }
  .status-badge.half-day { background: rgba(146, 100, 10, 0.08); color: var(--accent); border: 1px solid rgba(146, 100, 10, 0.2); }
  .status-badge.absent { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-brd); }
  .status-badge.weekend { background: var(--surface2); color: var(--muted2); border: 1px solid var(--border); }
  .status-badge.pending { background: var(--navy-light); color: var(--navy-mid); border: 1px solid #c5d8f5; }

  .late-badge {
    display: inline-flex; align-items: center; gap: 3px;

  @media print {
    body { background: #fff !important; padding: 0 !important; }
    .dtr-view-toggle-bar { display: none !important; }
    .cs48-paper {
      border: 1.5px solid #000 !important;
      box-shadow: none !important;
      max-width: 100% !important;
      width: 100% !important;
      padding: 0 !important;
    }
  }
</style>

<div class="dtr-report-wrap" id="dtrReportWrap">
  <!-- Filled by initDtrContent() -->
</div>

<script>
  function format12HourHHMM(timeStr) {
    if (!timeStr) return '';
    const parts = timeStr.split(":");
    if (parts.length < 2) return timeStr;
    let h = parseInt(parts[0], 10);
    const m = parts[1];
    // Keep 24-hour style format for CS48 grid if preferred or 12-hr
    const hh = String(h).padStart(2, '0');
    return `${hh}:${m}`;
  }

  function fmtMinutesToHHMM(mins) {
    if (!mins) return '00:00';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  function fmtMinutesToHHMMSS(mins) {
    if (!mins) return '0:00:00';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}:${String(m).padStart(2, '0')}:00`;
  }

  window.initDtrContent = function (data) {
    window._currentDtrData = data;
    const emp = data.employee;
    const period = data.period;
    const summary = data.summary;
    const days = data.days;

    // Default view mode = CS48 (Civil Service Form No. 48)
    window.setDtrViewMode = function (mode) {
      window._activeDtrViewMode = mode;

      if (mode === 'cs48') {
        $('#tabCsForm48').addClass('active');
        $('#tabDetailedAnalytics').removeClass('active');
        $('#csForm48Content').show();
        $('#analyticsContent').hide();
      } else {
        $('#tabDetailedAnalytics').addClass('active');
        $('#tabCsForm48').removeClass('active');
        $('#analyticsContent').show();
        $('#csForm48Content').hide();
      }
    };

    // ── Build Mode Toggle Bar ───────────────────────────────────────────────────
    const toggleBarHtml = `
    <div class="dtr-view-toggle-bar">
      <button class="dtr-view-tab active" id="tabCsForm48" onclick="setDtrViewMode('cs48')">
        📄 Civil Service Form No. 48 (Official DTR)
      </button>
      <button class="dtr-view-tab" id="tabDetailedAnalytics" onclick="setDtrViewMode('analytics')">
        📊 Detailed Analytics View
      </button>
    </div>`;

    // ── 1. BUILD OFFICIAL CIVIL SERVICE FORM NO. 48 (CS FORM 48) ───────────────
    const startDateStr = days.length ? days[0].date_str : '';
    const endDateStr   = days.length ? days[days.length - 1].date_str : '';

    const csRowsHtml = days.map(d => {
      let rowContent = '';

      if (d.is_weekend) {
        const weekendText = d.weekday === 'Sat' ? 'Saturday' : 'Sunday';
        rowContent = `
          <td class="cs48-td-day">${d.day}</td>
          <td colspan="8" class="cs48-span-cell">${weekendText}</td>
          <td></td>
        `;
      } else if (d.remarks && d.remarks.toLowerCase().includes('holiday')) {
        rowContent = `
          <td class="cs48-td-day">${d.day}</td>
          <td colspan="8" class="cs48-span-cell">Holiday</td>
          <td>${d.status === 'absent' ? '1' : ''}</td>
        `;
      } else {
        const amIn  = format12HourHHMM(d.am_in);
        const amOut = format12HourHHMM(d.am_out);
        const pmIn  = format12HourHHMM(d.pm_in);
        const pmOut = format12HourHHMM(d.pm_out);

        const utMins = (d.late_min || 0) + (d.undertime_min || 0);
        const utStr  = utMins > 0 ? fmtMinutesToHHMM(utMins) : '';
        const absentStr = d.status === 'absent' ? '1' : '';

        rowContent = `
          <td class="cs48-td-day">${d.day}</td>
          <td class="cs48-td-val">${amIn}</td>
          <td class="cs48-td-val">${amOut}</td>
          <td class="cs48-td-val">${pmIn}</td>
          <td class="cs48-td-val">${pmOut}</td>
          <td class="cs48-td-val"></td>
          <td class="cs48-td-val"></td>
          <td class="cs48-td-val"></td>
          <td class="cs48-td-val">${utStr}</td>
          <td class="cs48-td-val">${absentStr}</td>
        `;
      }

      return `<tr>${rowContent}</tr>`;
    }).join('');

    const csForm48Html = `
    <div id="csForm48Content">
      <div class="cs48-paper-wrap">
        <div class="cs48-paper">

          <div class="cs48-top-tag">Civil Service Form No. 48</div>

          <div class="cs48-header">
            <div class="h-rep">Republic of the Philippines</div>
            <div class="h-dept">Department of Education</div>
            <div class="h-reg">Region VI - Western Visayas</div>
            <div class="h-div">SCHOOLS DIVISION OF ILOILO</div>
            <div class="h-school">POTOTAN NATIONAL COMPREHENSIVE HIGH SCHOOL</div>
            <div class="h-id">(302556)</div>
            <div class="h-addr">CAU-AYAN, POTOTAN, ILOILO</div>
            <div class="h-title">DAILY TIME RECORD</div>
          </div>

          <div class="cs48-emp-block">
            <div class="cs48-emp-name">${emp.full_name.toUpperCase()}</div>
            <div class="cs48-emp-sub">Employee Name (${emp.id})</div>
          </div>

          <div class="cs48-period-bar">
            <div>For the month of <strong>${period.month_name}, ${period.year}</strong></div>
            <div>Date From: <strong>${startDateStr}</strong> &nbsp; To: <strong>${endDateStr}</strong></div>
          </div>

          <table class="cs48-table">
            <thead>
              <tr>
                <th rowspan="2" class="cs48-th-day">DAY</th>
                <th colspan="2">AM</th>
                <th colspan="2">PM</th>
                <th colspan="2">OVERTIME</th>
                <th colspan="2">TOTAL</th>
                <th rowspan="2" style="width:42px;">ABSENT</th>
              </tr>
              <tr>
                <th style="width:52px;">IN</th>
                <th style="width:52px;">OUT</th>
                <th style="width:52px;">IN</th>
                <th style="width:52px;">OUT</th>
                <th style="width:42px;">IN</th>
                <th style="width:42px;">OUT</th>
                <th style="width:42px;">OT</th>
                <th style="width:52px;">UT</th>
              </tr>
            </thead>
            <tbody>
              ${csRowsHtml}
            </tbody>
          </table>

          <div class="cs48-footer-block">
            <div class="cs48-summary-grid">
              <div>
                <div style="font-weight:bold;font-size:11px;">AM and PM TOTAL:</div>
                <div style="margin-left:12px;margin-top:2px;">
                  Late: <strong>${fmtMinutesToHHMM(summary.total_late_min)}</strong> &nbsp;&nbsp;&nbsp;&nbsp; UT: <strong>${fmtMinutesToHHMM(summary.total_undertime_min)}</strong>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:bold;font-size:11px;">TOTAL:</div>
                <div>Late and UT (h:m:s): <strong>${fmtMinutesToHHMMSS(summary.total_late_min + summary.total_undertime_min)}</strong></div>
                <div>Overtime: <strong>0:00:00</strong></div>
                <div>Days Absent: <strong>${summary.total_absent}</strong></div>
              </div>
            </div>

            <div class="cs48-cert-text">
              I CERTIFY on my honor that the above is true and correct record of the hours of work performed, record of which was made daily at the time of arrival and departure from the office.
            </div>

            <div class="cs48-sig-wrap">
              <div class="cs48-sig-box">
                <div class="cs48-sig-line"></div>
                <div class="cs48-sig-name">${emp.full_name.toUpperCase()}</div>
                <div class="cs48-sig-title">(Signature)</div>
              </div>
            </div>

            <div class="cs48-approval-block">
              <div style="font-size:11px;margin-bottom:4px;">Verified as to prescribed office hours:</div>
              <div style="font-size:11px;font-weight:bold;margin-bottom:20px;">Approved:</div>

              <div class="cs48-sig-wrap" style="margin-bottom:0;">
                <div class="cs48-sig-box">
                  <div class="cs48-sig-line"></div>
                  <div class="cs48-sig-name">${(emp.principal_name || 'GEMMA B. PEÑARANDA, EdD').toUpperCase()}</div>
                  <div class="cs48-sig-title">${(emp.principal_designation || 'PRINCIPAL IV').toUpperCase()}</div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>`;


    // ── 2. BUILD DETAILED ANALYTICS VIEW (RENAMED EXISTING VIEW) ───────────────
    function initials(name) {
      return name.split(' ').map(w => w[0] || '').slice(0, 2).join('').toUpperCase();
    }

    function fmtLate(min) {
      if (!min) return '';
      const h = Math.floor(min / 60);
      const m = min % 60;
      return h ? `${h}h ${m}m late` : `${m}m late`;
    }

    function statusBadge(status) {
      const labels = {
        'present': '● Present',
        'half-day': '◑ Half-Day',
        'absent': '○ Absent',
        'weekend': '— Weekend',
        'pending': '— Pending',
      };
      return `<span class="status-badge ${status}">${labels[status] || status}</span>`;
    }

    const analyticsHeaderHtml = `
    <div class="dtr-report-header">
      <div class="dtr-rh-left">
        <div class="dtr-rh-avatar">${initials(emp.full_name)}</div>
        <div>
          <div class="dtr-rh-name">${emp.full_name}</div>
          <div class="dtr-rh-sub">${emp.id} · ${emp.designation}</div>
          <div class="dtr-rh-sub" style="font-size:10.5px;color:var(--navy-mid);margin-top:3px;">
            <span style="background:var(--navy-light);border:1px solid #c5d8f5;border-radius:20px;padding:2px 8px;">
              📅 ${emp.schedule || 'Schedule based on designation'}
            </span>
          </div>
          <div class="dtr-rh-period">
            <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            ${period.label}
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted2);text-align:right;">
        Generated: ${new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' })}<br>
        <span style="font-size:10px;">Detailed DTR Analytics Summary</span>
      </div>
    </div>`;

    function fmtLateMin(min) {
      if (!min) return '0m';
      const h = Math.floor(min / 60), m = min % 60;
      return h ? h + 'h ' + m + 'm' : m + 'm';
    }

    const h1s = data.summary_h1;
    const h2s = data.summary_h2;
    const ovs = data.summary;

    function sumCell(big, bigCls, small) {
      return '<div class="dtr-sum-cell"><span class="dtr-sum-big ' + bigCls + '">' + big + '</span><span class="dtr-sum-small">' + small + '</span></div>';
    }

    const analyticsSummaryHtml = `
    <div class="dtr-summary-table">
      <div class="dtr-sum-head">
        <span>Metric</span>
        <span>1st Half (Days 1-15)</span>
        <span>2nd Half (Days 16-End)</span>
        <span>Overall Total</span>
      </div>
      <div class="dtr-sum-row">
        <div class="dtr-sum-row-lbl">Days Present</div>
        ${sumCell(h1s.present, '', h1s.halfday + ' half-day(s)')}
        ${sumCell(h2s.present, '', h2s.halfday + ' half-day(s)')}
        ${sumCell(ovs.total_present, '', ovs.total_halfday + ' half-day(s)')}
      </div>
      <div class="dtr-sum-row">
        <div class="dtr-sum-row-lbl">Absences</div>
        ${sumCell(h1s.absent, h1s.absent > 0 ? 'dtr-sum-late' : '', 'days missed')}
        ${sumCell(h2s.absent, h2s.absent > 0 ? 'dtr-sum-late' : '', 'days missed')}
        ${sumCell(ovs.total_absent, ovs.total_absent > 0 ? 'dtr-sum-late' : '', 'days missed')}
      </div>
      <div class="dtr-sum-row">
        <div class="dtr-sum-row-lbl">Total Late & Undertime</div>
        ${sumCell(fmtLateMin((h1s.late_min || 0) + (h1s.undertime_min || 0)), ((h1s.late_min || 0) + (h1s.undertime_min || 0)) > 0 ? 'dtr-sum-late' : '', 'deficiency')}
        ${sumCell(fmtLateMin((h2s.late_min || 0) + (h2s.undertime_min || 0)), ((h2s.late_min || 0) + (h2s.undertime_min || 0)) > 0 ? 'dtr-sum-late' : '', 'deficiency')}
        ${sumCell(fmtLateMin((ovs.total_late_min || 0) + (ovs.total_undertime_min || 0)), ((ovs.total_late_min || 0) + (ovs.total_undertime_min || 0)) > 0 ? 'dtr-sum-late' : '', 'deficiency')}
      </div>
      <div class="dtr-sum-row" style="background:rgba(22,163,74,0.04);">
        <div class="dtr-sum-row-lbl" style="color:var(--green);">VL Charged</div>
        ${sumCell(fmtLateMin(h1s.vl_charged_min || 0), 'dtr-sum-hours', 'covered by leave')}
        ${sumCell(fmtLateMin(h2s.vl_charged_min || 0), 'dtr-sum-hours', 'covered by leave')}
        ${sumCell(fmtLateMin(ovs.total_vl_charged_min || 0), 'dtr-sum-hours', 'covered by leave')}
      </div>
      <div class="dtr-sum-row" style="background:rgba(192,57,43,0.04);">
        <div class="dtr-sum-row-lbl" style="color:var(--red);">Unpaid (LWOP)</div>
        ${sumCell(fmtLateMin(h1s.unpaid_min || 0), (h1s.unpaid_min || 0) > 0 ? 'dtr-sum-late' : '', '₱' + (h1s.payroll_deduction || 0).toFixed(2))}
        ${sumCell(fmtLateMin(h2s.unpaid_min || 0), (h2s.unpaid_min || 0) > 0 ? 'dtr-sum-late' : '', '₱' + (h2s.payroll_deduction || 0).toFixed(2))}
        ${sumCell(fmtLateMin(ovs.total_unpaid_min || 0), (ovs.total_unpaid_min || 0) > 0 ? 'dtr-sum-late' : '', '₱' + (ovs.total_payroll_deduction || 0).toFixed(2))}
      </div>
      <div class="dtr-sum-row total-row">
        <div class="dtr-sum-row-lbl">Hours Dutied</div>
        ${sumCell(h1s.hours_dutied + 'h', 'dtr-sum-hours', 'rendered')}
        ${sumCell(h2s.hours_dutied + 'h', 'dtr-sum-hours', 'rendered')}
        ${sumCell(ovs.total_hours_dutied + 'h', 'dtr-sum-hours', 'total month')}
      </div>
    </div>`;

    const analyticsRowsHtml = days.map(d => {
      const rowClass = d.is_weekend ? 'row-weekend'
        : d.status === 'present' ? 'row-present'
          : d.status === 'half-day' ? 'row-halfday'
            : 'row-absent';

      const dayClass = d.is_weekend ? 'weekend' : d.status;
      const lateStr = fmtLate(d.late_min);

      let amHtml, pmHtml;
      if (d.is_weekend || !d.has_log) {
        amHtml = '<span class="no-log-text">—</span>';
        pmHtml = '<span class="no-log-text">—</span>';
      } else {
        amHtml = `
        <div class="time-pair">
          <span class="t-in">${d.am_in || '—'}</span>
          <span class="t-out">${d.am_out || '—'}</span>
        </div>`;
        pmHtml = `
        <div class="time-pair">
          <span class="t-in">${d.pm_in || '—'}</span>
          <span class="t-out">${d.pm_out || '—'}</span>
        </div>`;
      }

      const hoursCell = d.is_weekend || !d.has_log
        ? '<span class="no-log-text">—</span>'
        : '<span style="font-size:12px;color:var(--navy);font-weight:500;">' + (d.hours || 0) + 'h</span>';

      const vlChargedStr = d.vl_charged_min > 0 ? `<span style="color:var(--green);font-weight:600;">-${d.vl_charged_min}m VL</span>` : '0m';
      const unpaidStr = d.unpaid_min > 0 ? `<span style="color:var(--red);font-weight:600;">${d.unpaid_min}m LWOP</span>` : '0m';
      const deductStr = d.payroll_deduction > 0 ? `<span style="color:var(--red);font-weight:600;">₱${d.payroll_deduction.toFixed(2)}</span>` : '<span style="color:var(--green);">₱0.00</span>';

      return `
      <tr class="${rowClass}">
        <td>
          <div class="day-num-cell">
            <div class="day-num ${dayClass}">${d.day}</div>
            <div class="day-label">${d.weekday}</div>
          </div>
        </td>
        <td style="font-size:11.5px;color:var(--muted);">${d.date_str}</td>
        <td class="center">${amHtml}</td>
        <td class="center">${pmHtml}</td>
        <td class="center">${d.is_weekend ? '<span class="no-log-text">—</span>' : statusBadge(d.status)}</td>
        <td class="center">${lateStr ? '<span class="late-badge">\u23f1 ' + lateStr + '</span>' : (d.is_weekend || !d.has_log ? '<span class="no-log-text">—</span>' : '<span style="color:var(--green);font-size:11px;">On time</span>')}
          ${d.undertime_min > 0 ? '<br><span class="late-badge" style="background:rgba(192,57,43,0.08);color:#c0392b;border-color:rgba(192,57,43,0.2);">\u23f0 ' + fmtLate(d.undertime_min).replace('late', 'early') + '</span>' : ''}
        </td>
        <td class="center" style="font-size:11px;">${d.is_weekend || !d.has_log ? '—' : vlChargedStr}</td>
        <td class="center" style="font-size:11px;">${d.is_weekend || !d.has_log ? '—' : unpaidStr}</td>
        <td class="center" style="font-size:11px;">${d.is_weekend || !d.has_log ? '—' : deductStr}</td>
        <td class="center">${hoursCell}</td>
      </tr>`;
    }).join('');

    const analyticsTableHtml = `
    <div class="dtr-table-card">
      <div class="dtr-table-card-header">
        <div>
          <div class="dtr-table-card-title">Attendance Log Analytics — ${period.label}</div>
          <div class="dtr-table-card-sub">${days.length} days · ${summary.working_days} working days ${emp.vl_balance_formatted ? '· VL Balance: ' + emp.vl_balance_formatted : ''}</div>
        </div>
        <div class="dtr-legend">
          <div class="dtr-leg-item"><div class="dtr-leg-dot" style="background:var(--green);"></div> Present</div>
          <div class="dtr-leg-item"><div class="dtr-leg-dot" style="background:var(--accent);"></div> Half-Day</div>
          <div class="dtr-leg-item"><div class="dtr-leg-dot" style="background:var(--red);"></div> Absent</div>
          <div class="dtr-leg-item"><div class="dtr-leg-dot" style="background:var(--border2);"></div> Weekend</div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="dtr-table">
          <thead>
            <tr>
              <th style="width:70px;">Day</th>
              <th>Date</th>
              <th class="center" style="width:120px;">AM (In / Out)</th>
              <th class="center" style="width:120px;">PM (In / Out)</th>
              <th class="center" style="width:100px;">Status</th>
              <th class="center" style="width:100px;">Late/Under</th>
              <th class="center" style="width:90px;">VL Charged</th>
              <th class="center" style="width:90px;">Unpaid (LWOP)</th>
              <th class="center" style="width:100px;">Deduction (₱)</th>
              <th class="center" style="width:70px;">Hours</th>
            </tr>
          </thead>
          <tbody>${analyticsRowsHtml}</tbody>
        </table>
      </div>
    </div>`;

    const analyticsHtml = `
    <div id="analyticsContent" style="display:none;">
      ${analyticsHeaderHtml}
      ${analyticsSummaryHtml}
      ${analyticsTableHtml}
    </div>`;

    // ── Inject Everything ─────────────────────────────────────────────────────
    $('#dtrReportWrap').html(toggleBarHtml + csForm48Html + analyticsHtml);

    // Initial View Mode = CS Form 48
    setDtrViewMode('cs48');
  };


  // ── Print handler ─────────────────────────────────────────────────────────────
  window.printDtr = function () {
    const isCs48 = window._activeDtrViewMode !== 'analytics';
    const targetId = isCs48 ? 'csForm48Content' : 'analyticsContent';
    const content = document.getElementById(targetId).innerHTML;
    
    const win = window.open('', '_blank', 'width=900,height=750');
    win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>${isCs48 ? 'Civil Service Form No. 48 - Daily Time Record' : 'DTR Detailed Analytics'}</title>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
      <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family: ${isCs48 ? "'Times New Roman', Times, serif" : "'Plus Jakarta Sans', sans-serif"}; padding: 20px; color: #000; font-size: 12px; }
        ${$('style').map(function () { return $(this).text(); }).get().join('\n')}
      </style>
    </head>
    <body onload="window.print();window.close();">${content}</body>
    </html>`);
    win.document.close();
  };
</script>
